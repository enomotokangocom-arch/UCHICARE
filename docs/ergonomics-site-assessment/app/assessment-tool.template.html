<title>エルゴノミクス現地評価ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+Antique:wght@500;700;900&display=swap">
<style>
/* Layout: field notebook — visit header, four working tabs (基本情報 / 部門評価 / 個人評価 / 分析), item cards stacked one column for tablet use */
:root {
  --paper: #f5f7f4;
  --sheet: #ffffff;
  --ink: #1c2a26;
  --ink-soft: #4d5d58;
  --ink-faint: #7a8a84;
  --rule: #d5ddd8;
  --rule-strong: #a9b8b1;
  --accent: #1f6b55;
  --accent-ink: #ffffff;
  --accent-wash: #e3efe9;
  --head-bg: #e9eeeb;
  --warn-ink: #8a4b00;
  --warn-wash: #fdf0dc;
  /* rating status colors (fixed in both themes; always paired with symbol + label) */
  --st-good: #0ca30c;
  --st-partial: #fab219;
  --st-improve: #ec835a;
  --st-urgent: #d03b3b;
  --st-unk: #9aa5a1;
  --st-na: transparent;
  --f-display: "Zen Kaku Gothic Antique", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121816; --sheet: #182320; --ink: #e2ebe7; --ink-soft: #a3b3ad; --ink-faint: #7f918a;
    --rule: #2b3934; --rule-strong: #43564f; --accent: #6cc4a4; --accent-ink: #0f1d18; --accent-wash: #1d3a31;
    --head-bg: #1f2c28; --warn-ink: #f3b46b; --warn-wash: #3a2a17; --st-unk: #5f6d68; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121816; --sheet: #182320; --ink: #e2ebe7; --ink-soft: #a3b3ad; --ink-faint: #7f918a;
  --rule: #2b3934; --rule-strong: #43564f; --accent: #6cc4a4; --accent-ink: #0f1d18; --accent-wash: #1d3a31;
  --head-bg: #1f2c28; --warn-ink: #f3b46b; --warn-wash: #3a2a17; --st-unk: #5f6d68; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.35; }
h2 { font-size: 21px; font-weight: 900; margin: 28px 0 10px; }
h3 { font-size: 16px; font-weight: 700; margin: 20px 0 8px; }
p { margin: 6px 0; }
.muted { color: var(--ink-soft); font-size: 13px; }
.small { font-size: 12.5px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; padding-block: 22px 12px; border-bottom: 3px solid var(--ink); }
.top .brand { font-family: var(--f-display); font-weight: 900; font-size: 22px; }
.top .brand small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--accent); }
.save { font-size: 12.5px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 6px; }
.save::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--st-unk); }
.save[data-s="saved"]::before { background: var(--st-good); }
.save[data-s="saving"]::before { background: var(--st-partial); }
.save[data-s="error"]::before, .save[data-s="local"]::before { background: var(--st-urgent); }
.banner { margin: 12px 0; padding: 10px 14px; border-radius: 6px; background: var(--warn-wash); color: var(--warn-ink); font-size: 13.5px; }

/* buttons */
.btn { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 6px; padding: 7px 14px; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
.btn.danger { color: var(--st-urgent); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* visit list */
.visits { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 14px; }
.vcard { text-align: left; border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 8px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.vcard:hover { border-color: var(--accent); }
.vcard .t { font-weight: 700; font-size: 15.5px; overflow-wrap: anywhere; }
.vcard .m { font-size: 12.5px; color: var(--ink-soft); }
.empty { border: 1.5px dashed var(--rule-strong); border-radius: 10px; padding: 28px 20px; margin-top: 18px; display: grid; gap: 10px; justify-items: start; background: var(--sheet); }
.empty h2 { margin: 0; }

/* tabs */
.vhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 14px; }
.vhead .name { font-family: var(--f-display); font-weight: 900; font-size: 20px; overflow-wrap: anywhere; min-width: 0; }
.sampletag { font-size: 11.5px; font-weight: 700; color: var(--warn-ink); background: var(--warn-wash); padding: 1px 8px; border-radius: 999px; }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--paper); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--rule-strong); margin-top: 10px; }
.tabs button { flex: none; border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--ink-soft); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* forms */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 16px; }
label.f { display: grid; gap: 3px; font-size: 13px; color: var(--ink-soft); min-width: 0; }
label.f input, label.f select, label.f textarea, textarea.note, select.mini {
  border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); padding: 7px 10px; font-size: 14.5px; color: var(--ink); width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; line-height: 1.6; }
fieldset { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px 14px; margin: 14px 0; background: var(--sheet); min-width: 0; }
legend { font-weight: 700; padding: 0 6px; font-size: 14px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }

/* unit selector */
.unitbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 6px; align-items: center; }
.chip { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.progress { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* item cards */
.domainhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 22px 0 6px; border-bottom: 1px solid var(--rule-strong); padding-bottom: 4px; }
.domainhead h3 { margin: 0; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-left: 5px solid var(--rule); border-radius: 8px; padding: 12px 14px; margin: 8px 0; display: grid; gap: 8px; min-width: 0; }
.card[data-r="good"] { border-left-color: var(--st-good); }
.card[data-r="partial"] { border-left-color: var(--st-partial); }
.card[data-r="improve"] { border-left-color: var(--st-improve); }
.card[data-r="urgent"] { border-left-color: var(--st-urgent); }
.card[data-r="unk"] { border-left-color: var(--st-unk); }
.card[data-r="na"] { border-left-style: dashed; }
.chead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.cid { font-family: var(--f-display); font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
.ctitle { font-weight: 700; flex: 1 1 200px; min-width: 0; }
.kb { font-size: 11.5px; border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 6px; color: var(--ink-soft); white-space: nowrap; }
.star { color: #b8860b; }
details.ref summary { cursor: pointer; font-size: 13px; color: var(--accent); }
details.ref dl { margin: 6px 0 0; display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
details.ref dt { color: var(--ink-soft); font-weight: 700; }
details.ref dd { margin: 0; white-space: pre-line; }

.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg label > span { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 10px; font-size: 13.5px; background: var(--sheet); cursor: pointer; user-select: none; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg input:checked + span { font-weight: 700; border-width: 2px; padding: 4px 9px; }
.seg input[value="good"]:checked + span { border-color: var(--st-good); background: color-mix(in srgb, var(--st-good) 16%, var(--sheet)); }
.seg input[value="partial"]:checked + span { border-color: var(--st-partial); background: color-mix(in srgb, var(--st-partial) 22%, var(--sheet)); }
.seg input[value="improve"]:checked + span { border-color: var(--st-improve); background: color-mix(in srgb, var(--st-improve) 22%, var(--sheet)); }
.seg input[value="urgent"]:checked + span { border-color: var(--st-urgent); background: color-mix(in srgb, var(--st-urgent) 18%, var(--sheet)); }
.seg input[value="na"]:checked + span, .seg input[value="unk"]:checked + span { border-color: var(--ink-soft); background: var(--head-bg); }
.sym { font-weight: 900; width: 1.1em; text-align: center; }

.factors { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; background: var(--head-bg); border-radius: 6px; padding: 8px 10px; }
.factors label { display: grid; gap: 2px; font-size: 12.5px; color: var(--ink-soft); }
.prio { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.pbadge { display: inline-block; min-width: 4.6em; text-align: center; border-radius: 4px; padding: 0 6px; font-size: 12.5px; font-weight: 700; color: #fff; }
.pbadge.p1 { background: var(--st-urgent); }
.pbadge.p2 { background: #b8571f; }
.pbadge.p3 { background: #7a6a2a; }
.warnline { color: var(--warn-ink); font-size: 12.5px; }
.sharebox { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }

/* analysis */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; display: grid; gap: 2px; }
.tile .k { font-size: 12px; color: var(--ink-soft); }
.tile .v { font-family: var(--f-display); font-weight: 900; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile.alert .v { color: var(--st-urgent); }
.alertbox { border: 2px solid var(--st-urgent); border-radius: 8px; padding: 10px 14px; background: color-mix(in srgb, var(--st-urgent) 7%, var(--sheet)); margin: 10px 0; }
.alertbox h3 { margin: 0 0 4px; color: var(--st-urgent); }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; line-height: 1.55; }
th, td { text-align: left; vertical-align: top; padding: 7px 9px; border-bottom: 1px solid var(--rule); }
thead th { background: var(--head-bg); font-weight: 700; white-space: nowrap; font-size: 12.5px; }
tbody tr:last-child td { border-bottom: 0; }
table.plan { min-width: 900px; }
td.pre { white-space: pre-line; }

.map { display: grid; gap: 14px; margin-top: 10px; }
.maprow { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.maprow .u { font-weight: 700; margin-bottom: 6px; overflow-wrap: anywhere; }
.mapdomains { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.mapdomain { display: grid; gap: 3px; }
.mapdomain .dn { font-size: 11.5px; color: var(--ink-soft); }
.cells { display: flex; gap: 2px; }
.cell { width: 30px; height: 30px; border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-weight: 700; position: relative; border: 0; padding: 0; background: var(--head-bg); color: var(--ink-soft); }
.cell[data-r="good"] { background: var(--st-good); color: #fff; }
.cell[data-r="partial"] { background: var(--st-partial); color: #2a1d00; }
.cell[data-r="improve"] { background: var(--st-improve); color: #2a1206; }
.cell[data-r="urgent"] { background: var(--st-urgent); color: #fff; }
.cell[data-r="unk"] { background: repeating-linear-gradient(45deg, var(--st-unk) 0 3px, var(--head-bg) 3px 6px); color: var(--ink); }
.cell[data-r="na"] { background: transparent; border: 1px dashed var(--rule-strong); color: var(--ink-faint); }
.cell[data-r=""] { background: transparent; border: 1px solid var(--rule); color: var(--ink-faint); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .cell { width: 18px; height: 18px; font-size: 10px; }
.tip { position: fixed; z-index: 20; max-width: 300px; background: var(--ink); color: var(--paper); font-size: 12.5px; line-height: 1.5; padding: 7px 10px; border-radius: 6px; pointer-events: none; }
.list { display: grid; gap: 6px; margin: 8px 0; padding: 0; list-style: none; }
.list li { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; font-size: 13.5px; overflow-wrap: anywhere; }
.list li b { font-family: var(--f-display); }
.aiout { white-space: pre-wrap; background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 8px; padding: 14px 16px; font-size: 14px; line-height: 1.75; max-height: 70vh; overflow: auto; }
.export { display: grid; gap: 8px; }
textarea.copy { width: 100%; min-height: 160px; font-size: 12.5px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); padding: 8px; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><small>ERGONOMICS FIELD NOTE</small>エルゴノミクス現地評価ノート</div>
    <span class="save" id="save" data-s="idle">接続中…</span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="app">
    <section class="empty">
      <h2>訪問記録を読み込んでいます</h2>
      <p class="muted">部門・代表作業ごとに評価を入力し、優先順位・重大懸念・改善案を自動で整理します。記録はあなただけが見られる領域に保存されます。</p>
    </section>
  </main>
</div>
<div class="tip" id="tip" hidden></div>

<script>
(function () {
'use strict';
var ITEMS = /*__ITEMS__*/null;
var DOMAINS = ['作業姿勢・動作', '持ち上げ・運搬・力', '設備・道具', '作業環境', '作業設計', '認知的負担', '組織的条件'];
var JOBS = ['事務・情報機器作業', '製造', '物流・倉庫', '医療・介護', '営業・運転・外回り', '小売・飲食・サービス'];
var R_UNIT = [
  { v: 'good', s: '◎', l: '良好' }, { v: 'partial', s: '○', l: '一部改善' }, { v: 'improve', s: '△', l: '要改善' },
  { v: 'urgent', s: '!', l: '優先対応' }, { v: 'na', s: '—', l: '該当なし' }, { v: 'unk', s: '?', l: '未確認' }
];
var R_PERSON = [
  { v: 'good', s: '◎', l: '適合' }, { v: 'partial', s: '○', l: '一部調整' }, { v: 'improve', s: '△', l: '要調整' },
  { v: 'urgent', s: '!', l: '優先対応' }, { v: 'na', s: '—', l: '該当なし' }, { v: 'unk', s: '?', l: '未確認' }
];
var LEVELS = ['大', '中', '小'];
var LEVEL_HELP = {
  sev: { '大': '重いけが・休業のおそれ/法令上の義務に関わる', '中': '痛み・疲労の蓄積、ミス・手戻り', '小': '不便・不快にとどまる' },
  exp: { '大': '作業時間の大半・毎日何度も', '中': '毎日あるが一部の時間', '小': '週数回以下・繁忙時のみ' },
  scope: { '大': '部門の多くの作業者', '中': '特定の班・シフト', '小': '少数(1〜2名程度)' }
};
var itemById = {};
ITEMS.standard.concat(ITEMS.addon).forEach(function (it) { itemById[it.id] = it; });
var pById = {};
ITEMS.individual.forEach(function (it) { pById[it.id] = it; });

var S = { db: null, uid: null, visits: {}, cur: null, tab: 'info', unit: 0, person: 0, onlyShort: false, onlyEmpty: false,
          dirty: {}, saving: {}, again: {}, sample: null, downloads: null, aiBusy: false, aiCtl: null };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function rlabel(v, person) { var a = person ? R_PERSON : R_UNIT; for (var i = 0; i < a.length; i++) if (a[i].v === v) return a[i]; return null; }
function visit() { return S.cur ? S.visits[S.cur] : null; }

/* ---------- persistence ---------- */
function setSave(s, text) { var el = $('save'); el.dataset.s = s; el.textContent = text; }
function banner(text) { var b = $('banner'); if (text) { b.textContent = text; b.hidden = false; } else b.hidden = true; }

var timers = {};
function touch(id) {
  id = id || S.cur; if (!id) return;
  S.visits[id].updatedAt = new Date().toISOString();
  S.dirty[id] = true;
  if (!S.db) { setSave('local', 'この画面では保存されません'); return; }
  setSave('saving', '保存待ち…');
  clearTimeout(timers[id]);
  timers[id] = setTimeout(function () { flush(id); }, 900);
}
function flush(id) {
  if (!S.db || !S.visits[id]) return;
  if (S.saving[id]) { S.again[id] = true; return; }
  S.saving[id] = true; S.dirty[id] = false;
  setSave('saving', '保存中…');
  var data = JSON.parse(JSON.stringify(S.visits[id]));
  S.db.collection('data/users/' + S.uid).doc(id).set(data).then(function () {
    S.saving[id] = false;
    if (S.again[id] || S.dirty[id]) { S.again[id] = false; flush(id); return; }
    setSave('saved', '保存済み ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }));
  }).catch(function (e) {
    S.saving[id] = false; S.dirty[id] = true;
    setSave('error', '保存できませんでした');
    banner('保存に失敗しました(' + (e && e.code || 'error') + ')。' + (e && e.code === 'quota_exceeded' ? '保存容量の上限です。不要な訪問記録を削除してください。' : '通信状態を確認し、もう一度入力すると再保存します。'));
  });
}
function removeVisit(id) {
  delete S.visits[id];
  if (S.db) S.db.collection('data/users/' + S.uid).doc(id).delete().catch(function () { banner('削除に失敗しました。もう一度お試しください。'); });
}

function boot() {
  if (!window.claude || !window.claude.use) { offline(); return; }
  var to = setTimeout(offline, 11000);
  Promise.all([window.claude.use('user'), window.claude.use('db')]).then(function (r) {
    clearTimeout(to);
    var user = r[0], db = r[1];
    if (!user || !db) { offline(); return; }
    return user.id().then(function (id) {
      if (!id) { offline(); return; }
      S.uid = id; S.db = db;
      setSave('saved', '接続済み');
      db.collection('data/users/' + id).onSnapshot(function (snap) {
        snap.docs.forEach(function (d) {
          if (S.dirty[d.id] || S.saving[d.id] || d.metadata.hasPendingWrites) return;
          var v = d.data(); if (v && v.units) S.visits[d.id] = v;
        });
        var ids = snap.docs.map(function (d) { return d.id; });
        Object.keys(S.visits).forEach(function (k) { if (ids.indexOf(k) < 0 && !S.dirty[k] && !S.saving[k]) delete S.visits[k]; });
        if (!S.cur || S.tab === 'analysis') render();
        else if (!S.visits[S.cur]) { S.cur = null; render(); }
      }, function (e) { setSave('error', '読み込みエラー'); banner('記録の読み込みに失敗しました(' + (e && e.code) + ')。ページを開き直してください。'); });
    });
  }).catch(offline);
  window.claude.use('sample').then(function (s) { S.sample = s; if (S.tab === 'analysis') render(); });
  window.claude.use('downloads').then(function (d) { S.downloads = d; if (S.tab === 'analysis') render(); });
}
function offline() {
  if (S.db) return;
  setSave('local', '保存なし(閲覧モード)');
  banner('このビューでは記録を保存できません(サインインしていない、またはプレビュー表示)。入力は試せますが、ページを閉じると消えます。');
  render();
}

/* ---------- model helpers ---------- */
function newUnit() { return { id: uid(), dept: '', task: '', place: '', time: '', shift: '', workers: '', observation: '', hearing: '', docs: '', memo: '', jobs: [], ratings: {} }; }
function newVisit() {
  return { company: '', site: '', date: today(), assessors: '', purpose: '', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
           sample: false, units: [newUnit()], people: [], aiText: '' };
}
function unitItems(u) {
  var list = ITEMS.standard.slice();
  ITEMS.addon.forEach(function (it) { if (u.jobs.indexOf(it.job) >= 0) list.push(it); });
  return list;
}
function unitName(u, i) { var n = [u.dept, u.task].filter(Boolean).join(' / '); return n || ('評価単位 ' + (i + 1)); }
function priority(rt) {
  if (!rt) return null;
  if (rt.r === 'urgent') return 1;
  if (rt.r !== 'improve') return null;
  var s = rt.sev, e = rt.exp, c = rt.scope;
  if (!s) return 3;
  if (s === '大' && (e === '大' || c === '大')) return 1;
  if (s === '大') return 2;
  if (s === '中' && (e === '大' || c === '大')) return 2;
  return 3;
}
function factorsMissing(rt) { return rt && (rt.r === 'improve') && (!rt.sev || !rt.exp || !rt.scope); }
function isLaw(it) { return /法|努/.test(it.kubun || ''); }

/* ---------- rendering ---------- */

    '<span class="name">' + esc(v.company || '名称未設定の訪問') + (v.site ? ' ' + esc(v.site) : '') + '</span>' +
    (v.sample ? '<span class="sampletag">記入例</span>' : '') + '<span class="muted">' + esc(v.date || '') + '</span></div>';
  h += '<nav class="tabs" role="tablist">' + tabs.map(function (t) {
    return '<button role="tab" data-act="tab" data-v="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>';

/* ---------- analysis ---------- */
function analyze(v) {
  var A = { units: [], urgent: [], plan: [], strengths: [], unk: [], law: [], check: [], total: 0, done: 0, counts: { good: 0, partial: 0, improve: 0, urgent: 0, na: 0, unk: 0 } };
  v.units.forEach(function (u, ui) {
    var name = unitName(u, ui);
    var ua = { name: name, u: u, domains: [] };
    var items = unitItems(u);
    var groups = {};
    items.forEach(function (it) {
      var d = it.job ? '職種別' : it.domain; (groups[d] = groups[d] || []).push(it);
      A.total++;
      var rt = u.ratings[it.id] || {};
      if (!rt.r) return;
      A.done++; A.counts[rt.r]++;
      var rec = { unit: name, ui: ui, it: it, rt: rt };
      if (rt.r === 'urgent') A.urgent.push(rec);
      if (rt.r === 'urgent' || rt.r === 'improve') { rec.p = priority(rt); A.plan.push(rec); if (isLaw(it)) A.law.push(rec); }
      if (rt.r === 'good') A.strengths.push(rec);
      if (rt.r === 'unk') A.unk.push(rec);
      if ((rt.r === 'urgent' || rt.r === 'improve' || rt.r === 'good') && !(rt.note || '').trim()) A.check.push({ rec: rec, msg: '根拠(観察した事実)が未記入' });
      if (factorsMissing(rt)) A.check.push({ rec: rec, msg: '重大性・ばく露・対象範囲が未選択(暫定で優先度3)' });
      if (rt.r === 'unk' && !(rt.note || '').trim()) A.check.push({ rec: rec, msg: '未確認の理由・次回の確認方法が未記入' });
    });
    DOMAINS.concat(['職種別']).forEach(function (d) { if (groups[d]) ua.domains.push({ d: d, items: groups[d] }); });
    A.units.push(ua);
  });
  A.plan.sort(function (a, b) { return a.p - b.p || a.ui - b.ui; });
  // individuals
  var people = (v.people || []).filter(function (p) { return p.consent; });
  A.people = { n: people.length, items: [] };
  ITEMS.individual.forEach(function (it) {
    var c = { good: 0, partial: 0, improve: 0, urgent: 0, shared: 0, units: {} };
    people.forEach(function (p) {
      var rt = p.ratings[it.id]; if (!rt || !rt.r) return;
      if (c[rt.r] != null) c[rt.r]++;
      if ((rt.r === 'improve' || rt.r === 'urgent')) { if (rt.share) c.shared++; var k = p.unitId || '-'; c.units[k] = (c.units[k] || 0) + 1; }
    });
    A.people.items.push({ it: it, c: c });
  });
  return A;
}

function renderAnalysis(v) {
  var A = analyze(v);
  var p1 = A.plan.filter(function (r) { return r.p === 1; }).length, p2 = A.plan.filter(function (r) { return r.p === 2; }).length, p3 = A.plan.filter(function (r) { return r.p === 3; }).length;
  var h = '<h2>分析とフィードバック</h2><p class="muted">合計点は出しません。重大懸念は別に示し、要改善の項目を重大性・ばく露・対象範囲から優先度1〜3に分けています。「該当なし」「未確認」は集計から除きます。</p>';
  h += '<div class="tiles">' +
    tile('入力済み', A.done + ' / ' + A.total) + tile('重大懸念', A.urgent.length, A.urgent.length > 0) +
    tile('優先度1', p1, p1 > 0) + tile('優先度2', p2) + tile('優先度3', p3) + tile('未確認', A.counts.unk) + tile('記入の不足', A.check.length) + '</div>';

  if (A.urgent.length) {
    h += '<div class="alertbox"><h3>! 重大懸念(総合評価とは別に、当日中に伝える事項)</h3><ul class="list">' + A.urgent.map(function (r) {
      return '<li><b>' + esc(r.it.id) + ' ' + esc(r.it.title) + '</b> ・ ' + esc(r.unit) + '<br>' + esc(r.rt.note || '(根拠未記入)') + '</li>';
    }).join('') + '</ul></div>';
  }

  h += '<h3>評価マップ</h3><p class="muted small">1マス=1項目。マスにカーソルを合わせる(タップする)と内容が出ます。マスを押すとその項目へ移動します。</p><div class="map">' + A.units.map(function (ua, ui) {
    return '<div class="maprow"><div class="u">' + esc(ua.name) + '</div><div class="mapdomains">' + ua.domains.map(function (dd) {
      var cnt = { improve: 0, urgent: 0 };
      dd.items.forEach(function (it) { var rt = ua.u.ratings[it.id] || {}; if (cnt[rt.r] != null) cnt[rt.r]++; });
      return '<div class="mapdomain"><span class="dn">' + esc(dd.d) + (cnt.improve + cnt.urgent ? ' ・ 課題' + (cnt.improve + cnt.urgent) : '') + '</span><div class="cells">' + dd.items.map(function (it) {
        var rt = ua.u.ratings[it.id] || {}; var rl = rlabel(rt.r);
        return '<button class="cell" data-r="' + (rt.r || '') + '" data-act="jump" data-u="' + ui + '" data-v="' + it.id + '" data-tip="' + esc(it.id + ' ' + it.title + ' — ' + (rl ? rl.l : '未入力') + (rt.note ? '\n' + rt.note.slice(0, 120) : '')) + '" aria-label="' + esc(it.id + ' ' + (rl ? rl.l : '未入力')) + '">' + (rl ? rl.s : '') + '</button>';
      }).join('') + '</div></div>';
    }).join('') + '</div></div>';
  }).join('') + '</div><div class="legend">' + R_UNIT.map(function (o) { return '<span><span class="cell" data-r="' + o.v + '">' + o.s + '</span>' + o.l + '</span>'; }).join('') +
    '<span><span class="cell" data-r=""></span>未入力</span></div>';

  h += '<h3>優先して改善する課題</h3>';
  if (!A.plan.length) h += '<p class="muted">要改善・優先対応の項目はまだありません。</p>';
  else h += '<div class="tablewrap"><table class="plan"><thead><tr><th>優先度</th><th>評価単位</th><th>項目</th><th>観察された事実</th><th>重大性/ばく露/範囲</th><th>改善案(例)</th><th>種別</th><th>区分</th></tr></thead><tbody>' +
    A.plan.map(function (r) {
      return '<tr><td><span class="pbadge p' + r.p + '">優先度' + r.p + '</span>' + (r.rt.r === 'urgent' ? '<br><span class="warnline">重大懸念</span>' : '') + '</td><td>' + esc(r.unit) + '</td><td><b>' + esc(r.it.id) + '</b> ' + esc(r.it.title) +
        '</td><td class="pre">' + esc(r.rt.note || '(未記入)') + '</td><td>' + esc([r.rt.sev, r.rt.exp, r.rt.scope].map(function (x) { return x || '—'; }).join(' / ')) +
        '</td><td class="pre">' + esc(r.it.improve) + '</td><td>' + esc(r.rt.kind || '—') + '</td><td>' + esc(r.it.kubun) + '</td></tr>';
    }).join('') + '</tbody></table></div><p class="muted small">優先度1=すぐ対応、優先度2=3か月以内に着手、優先度3=半年〜1年で計画。同じ優先度なら「すぐできる改善」から着手を提案します。改善案は評価表の例示です。観察した事実に合わせて具体化してください。</p>';

  if (A.law.length) h += '<h3>法令・指針に関わる可能性がある課題(要確認)</h3><ul class="list">' + A.law.map(function (r) {
    return '<li><b>' + esc(r.it.id) + '</b> ' + esc(r.it.title) + ' ・ ' + esc(r.unit) + ' ・ 区分:' + esc(r.it.kubun) + '</li>'; }).join('') + '</ul><p class="muted small">区分の「法」「努」は法令上の義務・努力義務に関わる項目です。適合の判断は原文で確認してください(評価キット第9章)。</p>';

  h += '<h3>主な強み(良好の根拠)</h3>';
  h += A.strengths.length ? '<ul class="list">' + A.strengths.map(function (r) { return '<li><b>' + esc(r.it.id) + '</b> ' + esc(r.it.title) + ' ・ ' + esc(r.unit) + (r.rt.note ? '<br>' + esc(r.rt.note) : '') + '</li>'; }).join('') + '</ul>' : '<p class="muted">良好と評価した項目はまだありません。</p>';

  if (A.unk.length) h += '<h3>未確認の項目(次回の確認事項)</h3><ul class="list">' + A.unk.map(function (r) { return '<li><b>' + esc(r.it.id) + '</b> ' + esc(r.it.title) + ' ・ ' + esc(r.unit) + (r.rt.note ? '<br>' + esc(r.rt.note) : '') + '</li>'; }).join('') + '</ul>';
  if (A.check.length) h += '<h3>記入の不足</h3><ul class="list">' + A.check.map(function (c) { return '<li><button class="btn ghost" data-act="jump" data-u="' + c.rec.ui + '" data-v="' + c.rec.it.id + '">' + esc(c.rec.it.id) + '</button> ' + esc(c.rec.unit) + ':' + esc(c.msg) + '</li>'; }).join('') + '</ul>';

  // individuals
  h += '<h3>個人評価の集計</h3>';
  if (!A.people.n) h += '<p class="muted">同意のある個人評価はありません。</p>';
  else {
    var small = A.people.n < 5;
    h += '<p class="muted small">同意のある ' + A.people.n + '名分。' + (small ? '5名未満のため、企業向けの報告では人数を出さず、共通する設備・作業の課題としてのみ記載してください。' : '企業向けの報告では、本人が共有に同意した項目だけを人数単位で記載します。') + '</p>';
    h += '<div class="tablewrap"><table><thead><tr><th>項目</th><th>適合</th><th>一部調整</th><th>要調整</th><th>優先対応</th><th>うち共有同意</th><th>部門課題への反映</th></tr></thead><tbody>' + A.people.items.map(function (x) {
      var multi = Object.keys(x.c.units).some(function (k) { return x.c.units[k] >= 2; });
      return '<tr><td><b>' + x.it.id + '</b> ' + esc(x.it.title) + '</td><td>' + x.c.good + '</td><td>' + x.c.partial + '</td><td>' + x.c.improve + '</td><td>' + x.c.urgent + '</td><td>' + x.c.shared + '</td><td>' +
        (multi ? '同じ評価単位で2名以上が要調整:部門項目 ' + esc(x.it.unitRef) + ' で課題として扱う' : '—') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  // AI feedback
  h += '<h3>所見文の下書き(AI)</h3>';
  if (S.sample) {
    h += '<p class="muted small">入力した評価・根拠メモ・個人評価の集計(共有同意分のみ)をもとに、企業向け報告書の構成で所見文を作成します。本人の意見欄は送信しません。根拠メモに氏名が含まれていないことを確認してから実行してください。</p>' +
      '<div class="row"><button class="btn primary" data-act="ai" ' + (S.aiBusy || !A.done ? 'disabled' : '') + '>' + (S.aiBusy ? '作成中…' : (v.aiText ? '所見文を作り直す' : '所見文を作成する')) + '</button>' +
      (S.aiBusy ? '<button class="btn" data-act="aistop">中止</button>' : '') + '</div>' +
      '<div class="aiout" id="aiout" ' + (v.aiText || S.aiBusy ? '' : 'hidden') + '>' + esc(v.aiText || '') + '</div><p class="muted small">AIの下書きです。事実・数値・法令の記載は必ず評価者が確認・修正してください。</p>';
  } else h += '<p class="muted">このビューではAIによる下書きを利用できません。下の「報告書の下書き」をご利用ください。</p>';

  // export
  h += '<h3>書き出し</h3><div class="export"><div class="row">' +
    (S.downloads ? '<button class="btn" data-act="dlcsv">評価結果をCSVで保存</button><button class="btn" data-act="dlmd">報告書の下書きを保存(.md)</button>' : '') +
    '<button class="btn" data-act="copymd">報告書の下書きをコピー</button></div>' +
    '<textarea class="copy" id="mdbox" readonly aria-label="報告書の下書き">' + esc(reportMd(v, A)) + '</textarea></div>';
  return h;
}
function tile(k, v, alert) { return '<div class="tile' + (alert ? ' alert' : '') + '"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }

function reportMd(v, A) {
  A = A || analyze(v);
  var L = [];
  L.push('# エルゴノミクス現地評価 報告書(下書き)', '', '- 企業・事業場:' + (v.company || '') + ' ' + (v.site || ''), '- 訪問日:' + (v.date || ''), '- 評価者:' + (v.assessors || ''), '');
  L.push('## 0. 要約', '');
  L.push('- 重大懸念:' + (A.urgent.length ? A.urgent.length + '件(' + A.urgent.map(function (r) { return r.it.id + ' ' + r.it.title; }).join('、') + ')' : 'なし'));
  L.push('- 優先して改善する課題:' + (A.plan.slice(0, 3).map(function (r) { return '[優先度' + r.p + '] ' + r.unit + ' ' + r.it.title; }).join(' / ') || 'なし'));
  L.push('- 主な強み:' + (A.strengths.slice(0, 3).map(function (r) { return r.unit + ' ' + r.it.title; }).join(' / ') || '—'), '');
  L.push('## 1. 評価の目的と方法', '', '部門・代表作業を単位に、観察・設備や資料の確認・短い聞き取りで評価しました。従業員個人の能力・健康状態は評価していません。', '');
  A.units.forEach(function (ua) {
    var u = ua.u;
    L.push('- ' + ua.name + ':場所 ' + (u.place || '—') + '/時間帯 ' + (u.time || '—') + '/従事 ' + (u.workers || '—') + '/観察 ' + (u.observation || '—') + '/聞き取り ' + (u.hearing || '—'));
  });
  L.push('', '## 2. 部門・作業ごとの結果', '');
  A.units.forEach(function (ua) {
    var c = { good: 0, partial: 0, improve: 0, urgent: 0, na: 0, unk: 0 };
    unitItems(ua.u).forEach(function (it) { var rt = ua.u.ratings[it.id]; if (rt && rt.r) c[rt.r]++; });
    L.push('### ' + ua.name, '', '良好 ' + c.good + ' / 一部改善 ' + c.partial + ' / 要改善 ' + c.improve + ' / 優先対応 ' + c.urgent + ' / 該当なし ' + c.na + ' / 未確認 ' + c.unk, '');
    A.strengths.filter(function (r) { return r.ui === A.units.indexOf(ua); }).forEach(function (r) { L.push('- 強み:' + r.it.title + (r.rt.note ? '(' + r.rt.note.replace(/\n/g, ' ') + ')' : '')); });
    A.plan.filter(function (r) { return r.ui === A.units.indexOf(ua); }).forEach(function (r) { L.push('- 課題[優先度' + r.p + ']:' + r.it.title + (r.rt.note ? '(' + r.rt.note.replace(/\n/g, ' ') + ')' : '')); });
    L.push('');
  });
  L.push('## 3. 優先して改善する課題と改善策の案', '', '| 優先度 | 評価単位 | 項目 | 観察された事実 | 改善案(例) | 種別 | 区分 |', '|---|---|---|---|---|---|---|');
  A.plan.forEach(function (r) { L.push('| ' + r.p + ' | ' + r.unit + ' | ' + r.it.id + ' ' + r.it.title + ' | ' + (r.rt.note || '').replace(/\n/g, ' ').replace(/\|/g, '/') + ' | ' + r.it.improve.replace(/\n/g, ' ') + ' | ' + (r.rt.kind || '') + ' | ' + r.it.kubun + ' |'); });
  if (A.law.length) L.push('', '法令・指針に関わる可能性がある項目(要確認):' + A.law.map(function (r) { return r.it.id; }).join('、'));
  if (A.people.n) {
    L.push('', '## 個別調整の実施状況', '');
    if (A.people.n < 5) L.push('個人評価を実施しました(人数は個人が特定されないよう記載しません)。');
    else L.push('個人評価:' + A.people.n + '名(本人同意あり)');
    A.people.items.forEach(function (x) { if (x.c.shared >= 1 && A.people.n >= 5) L.push('- ' + x.it.title + ':調整が必要(共有同意 ' + x.c.shared + '名)'); else if (x.c.shared >= 1) L.push('- ' + x.it.title + ':調整が必要な例あり'); });
  }
  L.push('', '## 5. 企業に確認・決定していただきたい事項', '', '- 各改善策の実施担当と期限', '- 設備投資・人員配置など「検討を要する改善」の判断時期');
  if (A.unk.length) L.push('- 未確認項目の確認方法:' + A.unk.map(function (r) { return r.it.id; }).join('、'));
  L.push('', '## 6. 再評価の方法', '', '優先度1は1か月後、その他は3〜6か月後に、同じ評価単位・同じ時間帯・同じ方法で観察して変化を確認します。', '');
  L.push('## 7. 評価結果の読み方と限界', '', '訪問日・時間帯・観察した作業の範囲での定性的評価です。合計点で職場の良否を判断するものではなく、医学的診断や個人の健康状態の判定ではありません。');
  if (v.aiText) L.push('', '---', '', '## 付録:所見文(AI下書き・要確認)', '', v.aiText);
  return L.join('\n');
}

function csvOut(v) {
  var rows = [['評価単位', '部門', '代表作業', 'ID', '評価領域', '確認項目', '評価', '根拠・現場メモ', '重大性', 'ばく露', '対象範囲', '優先度', '改善の種別', '区分', '改善案(例)']];
  v.units.forEach(function (u, i) {
    unitItems(u).forEach(function (it) {
      var rt = u.ratings[it.id] || {}; var rl = rlabel(rt.r);
      rows.push([unitName(u, i), u.dept, u.task, it.id, it.job ? '職種別:' + it.job : it.domain, it.title, rl ? rl.l : '', rt.note || '', rt.sev || '', rt.exp || '', rt.scope || '', priority(rt) || '', rt.kind || '', it.kubun, it.improve]);
    });
  });
  return '﻿' + rows.map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
}

function runAI() {
  var v = visit(); var vid = S.cur; if (!S.sample || S.aiBusy) return;
  var A = analyze(v);
  var payload = {
    visit: { company: v.company, site: v.site, date: v.date, purpose: v.purpose },
    units: A.units.map(function (ua) {
      var u = ua.u;
      return { name: ua.name, place: u.place, time: u.time, workers: u.workers, observation: u.observation, hearing: u.hearing,
        items: unitItems(u).filter(function (it) { var rt = u.ratings[it.id]; return rt && rt.r; }).map(function (it) {
          var rt = u.ratings[it.id];
          return { id: it.id, title: it.title, rating: rlabel(rt.r).l, note: rt.note || '', severity: rt.sev || '', exposure: rt.exp || '', scope: rt.scope || '', priority: priority(rt), legal: it.kubun, exampleImprovement: it.improve };
        }) };
    }),
    individualSummary: A.people.n ? { consentedCount: A.people.n < 5 ? '5名未満' : A.people.n, itemsNeedingAdjustmentWithSharingConsent: A.people.items.filter(function (x) { return x.c.shared; }).map(function (x) { return x.it.title; }) } : null
  };
  var prompt = 'あなたは産業保健と人間工学に詳しい評価者の補助です。以下は企業への現地訪問で評価者が入力したエルゴノミクス評価の結果(JSON)です。\n' +
    'これをもとに、経営者・部門責任者向けの所見文の下書きを日本語で作成してください。\n\n' +
    '構成(見出しはこの順):\n1. 要約(重大懸念の有無、優先課題3つまで、強み3つまで)\n2. 部門・作業ごとの主な強み\n3. 優先して改善する課題(優先度と理由:重大性・ばく露・対象範囲)\n4. 改善策と実施時期の案(すぐできる改善/検討を要する改善を分ける)\n5. 企業に確認・決定してほしい事項\n6. 再評価の方法\n7. 評価結果の読み方と限界\n\n' +
    '守ること:\n- 入力にある事実だけを使い、数値・事実・法令の条文番号を新たに作らない。根拠メモが空の項目は「根拠の記載なし」と書く。\n- 課題は作業・設備・仕組みを主語にし、個人を責める表現や個人が特定される表現を使わない。\n- 医学的診断、疾病リスクの断定、個人の健康状態の判定をしない。\n- legal が「法」「努」を含む項目は「法令上の義務・努力義務に関わる可能性(要確認)」と書き、推奨事項と区別する。\n- 項目IDを括弧で添える(例:B1)。\n- 全体で1800字程度まで。Markdownの見出し(##)と箇条書きを使う。\n\n評価結果JSON:\n' + JSON.stringify(payload);
  S.aiBusy = true; S.aiCtl = new AbortController(); render();
  var out = $('aiout'); if (out) out.textContent = '作成しています…';
  S.sample(prompt, { modelTier: 'default', cache: false, signal: S.aiCtl.signal, onText: function (u) { var o = $('aiout'); if (o) o.textContent = u.text; } })
    .then(function (res) { var cv = S.visits[vid]; if (!cv) return; cv.aiText = res.text + (res.truncated ? '\n\n(途中で終了しました。もう一度作成してください)' : ''); touch(vid); })
    .catch(function (e) {
      var msg = { not_granted: 'AIの利用が許可されていません。', rate_limited: '利用が集中しています。少し時間をおいてから作成してください。', cancelled: '作成を中止しました。', prompt_too_large: '入力が長すぎます。根拠メモを短くしてください。' }[e && e.code] || ('作成できませんでした(' + (e && e.code || 'error') + ')。');
      var cv = S.visits[vid]; if (e && e.text && cv) { cv.aiText = e.text; touch(vid); } banner(msg);
    })
    .then(function () { S.aiBusy = false; S.aiCtl = null; if (S.tab === 'analysis') render(); });
}

  u1.ratings = {

    A3: { r: 'partial', note: '立ちっぱなしだが移動が多い。休憩以外に座る場所はない' },

    B2: { r: 'improve', note: '台車3台あるが保管場所が作業場所から約40m。観察中は使用なし。4名中3名が「取りに行く時間がない」', sev: '中', exp: '大', scope: '中', kind: 'すぐできる改善' },

    C5: { r: 'improve', note: '重量物が最下段に配置されている列がある', sev: '中', exp: '中', scope: '大', kind: 'すぐできる改善' },
    D1: { r: 'urgent', note: '1階非常口前に返品パレット2枚が置かれ、扉の開放範囲がふさがれていた(10:15確認)。出荷課長に10:30に口頭で伝達', sev: '大', exp: '中', scope: '大', kind: 'すぐできる改善' },
    D2: { r: 'good', note: '通路・棚前とも暗い場所なし(照度は企業の測定記録で確認)' },
    D3: { r: 'unk', note: '訪問は10月で暑熱なし。夏季の熱中症対策手順は資料未提出。次回提出を依頼' },
    E1: { r: 'improve', note: '出荷締め(11時)前はペース調整ができないと管理者・従業員とも回答', sev: '中', exp: '大', scope: '大', kind: '検討を要する改善' },
    E2: { r: 'improve', note: '10〜11時は休憩が取れず、欠員時は特定の班に集中', sev: '中', exp: '中', scope: '大', kind: '検討を要する改善' },
    F1: { r: 'improve', note: '手順書(2019年版)が現行端末と一致せず、新人は口頭で確認', sev: '中', exp: '中', scope: '中', kind: 'すぐできる改善' },
    G1: { r: 'good', note: '不具合報告から修理までの流れが掲示され、直近3か月で4件修理' },
    G2: { r: 'partial', note: '日中は応援を呼べるが、夕方は人が少ない' },
    'X-LG2': { r: 'good', note: '歩行者通路が床面表示で区分され、交差点にミラーあり' }
  };
  var u2 = newUnit(); Object.assign(u2, { dept: '事務課', task: '受注入力', place: '2階 事務室', time: '14:00〜14:30', shift: '日勤', workers: '約10名', observation: '10席を巡回、約20分', hearing: '従業員3名', jobs: ['事務・情報機器作業'] });
  u2.ratings = {
    A1: { r: 'na', note: '持ち上げ・前かがみを伴う作業なし' }, B1: { r: 'na', note: '重量物の取扱いなし' }, B2: { r: 'na', note: '重量物の取扱いなし' },
    A3: { r: 'partial', note: '入力が続く午後は1時間以上座りっぱなしになることがあると3名中2名' },
    C2: { r: 'good', note: '全席で座面高さ・背もたれ調整可。足台の貸出あり' },
    C3: { r: 'improve', note: '10席中6席でノートPCを単体使用し、画面が目の高さより大きく下', sev: '中', exp: '大', scope: '大', kind: 'すぐできる改善' },
    D2: { r: 'good', note: '机上の照度は企業の測定記録で基準以上。窓際の映り込みなし' },
    F2: { r: 'partial', note: '電話の取次ぎが入力中に1時間あたり数回入る' },
    'X-OF2': { r: 'improve', note: '外付けキーボード・スタンドの貸与制度はあるが3名とも知らなかった', sev: '小', exp: '大', scope: '大', kind: 'すぐできる改善' }
  };
  v.units = [u1, u2];
  v.people = [{ id: uid(), code: 'P-01', unitId: u1.id, consent: true, ratings: {
    P1: { r: 'improve', note: '梱包台が肘より約15cm低い。天板を置く調整で前かがみが減ることを本人と確認', opinion: '梱包台が低くて腰を曲げたままになる', share: true },
    P4: { r: 'partial', note: 'テープカッターを利き手側に移動', share: false },
    P6: { r: 'improve', note: '最下段の重量ケースの取り出しが多い', share: true } } }];
  return v;
}

/* ---------- events ---------- */
function setPath(obj, path, val) {
  var ks = path.split('.'); var o = obj;
  for (var i = 0; i < ks.length - 1; i++) { var k = ks[i]; if (o[k] == null) o[k] = {}; o = o[k]; }
  o[ks[ks.length - 1]] = val;
}
function rerenderCard(path) {
  var v = visit(); var m;
  if ((m = path.match(/^units\.(\d+)\.ratings\.([^.]+)\./))) {
    var u = v.units[+m[1]]; var it = itemById[m[2]]; var el = $('card_' + m[2]);
    if (el && it) { var tmp = document.createElement('div'); tmp.innerHTML = unitCard(u, it); el.replaceWith(tmp.firstChild); }
    var items = unitItems(u); var done = items.filter(function (x) { var rt = u.ratings[x.id]; return rt && rt.r; }).length;
    var pg = $('prog'); if (pg) pg.textContent = '入力 ' + done + ' / ' + items.length;
  } else if ((m = path.match(/^people\.(\d+)\.ratings\.([^.]+)\./))) {
    var el2 = $('pcard_' + m[2]); var rt = v.people[+m[1]].ratings[m[2]] || {}; if (el2) el2.dataset.r = rt.r || '';
  } else render();
}

document.addEventListener('input', function (e) {
  var t = e.target; var path = t.dataset && t.dataset.path; if (!path || !visit()) return;
  if (t.type === 'checkbox' || t.tagName === 'SELECT') return;
  setPath(visit(), path, t.value); touch();
  if (/\.note$/.test(path)) { var card = t.closest('.card'); var w = card && card.querySelector('.notewarn'); if (w) w.hidden = !!t.value.trim(); }
  if (path === 'company' || path === 'site') { var n = document.querySelector('.vhead .name'); if (n) n.textContent = (visit().company || '名称未設定の訪問') + (visit().site ? ' ' + visit().site : ''); }
});
document.addEventListener('change', function (e) {
  var t = e.target; var v = visit();
  if (t.dataset.act === 'fshort') { S.onlyShort = t.checked; render(); return; }
  if (t.dataset.act === 'fempty') { S.onlyEmpty = t.checked; render(); return; }
  if (!v) return;
  if (t.dataset.rate) { setPath(v, t.dataset.rate, t.value); touch(); rerenderCard(t.dataset.rate); return; }
  if (t.dataset.job) {
    var u = v.units[S.unit]; var j = t.dataset.job; var i = u.jobs.indexOf(j);
    if (t.checked && i < 0) u.jobs.push(j); if (!t.checked && i >= 0) u.jobs.splice(i, 1);
    touch(); render(); return;
  }
  var path = t.dataset.path; if (!path) return;
  if (t.type === 'checkbox') setPath(v, path, t.checked);
  else if (t.tagName === 'SELECT') setPath(v, path, t.value);
  else return;
  touch();
  if (t.dataset.rerender) { if (/^people\.\d+\.consent$/.test(path)) render(); else rerenderCard(path); }
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  var act = b.dataset.act, val = b.dataset.v, v = visit();
  if (act === 'home') { S.cur = null; render(); window.scrollTo(0, 0); }
  else if (act === 'new') { var id = 'v' + uid(); S.visits[id] = newVisit(); S.cur = id; S.tab = 'info'; S.unit = 0; S.person = 0; touch(id); render(); }
  else if (act === 'sample') { var sid = 'v' + uid(); S.visits[sid] = sampleVisit(); S.cur = sid; S.tab = 'analysis'; S.unit = 0; S.person = 0; touch(sid); render(); window.scrollTo(0, 0); }
  else if (act === 'open') { S.cur = val; S.tab = 'units'; S.unit = 0; S.person = 0; render(); window.scrollTo(0, 0); }
  else if (act === 'tab') { S.tab = val; render(); window.scrollTo(0, 0); }
  else if (act === 'unit') { S.unit = +val; render(); }
  else if (act === 'addunit') { v.units.push(newUnit()); S.unit = v.units.length - 1; touch(); render(); }
  else if (act === 'person') { S.person = +val; render(); }
  else if (act === 'addperson') { v.people = v.people || []; v.people.push({ id: uid(), code: 'P-' + String(v.people.length + 1).padStart(2, '0'), unitId: '', consent: false, ratings: {} }); S.person = v.people.length - 1; touch(); render(); }
  else if (act === 'askdel' || act === 'askdelunit' || act === 'askdelperson') {
    var row = $(act === 'askdel' ? 'delrow' : act === 'askdelunit' ? 'delunitrow' : 'delpersonrow');
    var what = { askdel: 'この訪問記録をすべて削除します。元に戻せません。', askdelunit: 'この評価単位と入力した評価を削除します。', askdelperson: 'この個人評価を削除します。' }[act];
    row.innerHTML = '<span class="confirm">' + what + ' <button class="btn danger" data-act="' + act.replace('ask', 'do') + '">削除する</button><button class="btn" data-act="cancel">やめる</button></span>';
  }
  else if (act === 'cancel') render();
  else if (act === 'dodel') { removeVisit(S.cur); S.cur = null; render(); }
  else if (act === 'dodelunit') { v.units.splice(S.unit, 1); S.unit = 0; touch(); render(); }
  else if (act === 'dodelperson') { v.people.splice(S.person, 1); S.person = 0; touch(); render(); }
  else if (act === 'jump') { S.tab = 'units'; S.unit = +b.dataset.u; S.onlyShort = false; S.onlyEmpty = false; render(); var c = $('card_' + val); if (c) { c.scrollIntoView({ block: 'center' }); var ta = c.querySelector('textarea'); if (ta) ta.focus({ preventScroll: true }); } }
  else if (act === 'ai') runAI();
  else if (act === 'aistop') { if (S.aiCtl) S.aiCtl.abort(); }
  else if (act === 'dlcsv' || act === 'dlmd') {
    var name = (v.company || '訪問') + '_' + (v.date || today());
    var req = act === 'dlcsv' ? { filename: name + '_評価結果.csv', data: new Blob([csvOut(v)], { type: 'text/csv' }) } : { filename: name + '_報告書下書き.md', data: reportMd(v) };
    S.downloads.save(req).catch(function (er) { if (er && er.code !== 'declined') banner('保存できませんでした(' + (er && er.code) + ')。「報告書の下書きをコピー」をご利用ください。'); });
  }
  else if (act === 'copymd') {
    var box = $('mdbox');
    var done = function () { b.textContent = 'コピーしました'; setTimeout(function () { b.textContent = '報告書の下書きをコピー'; }, 1600); };
    try { navigator.clipboard.writeText(box.value).then(done, function () { box.select(); }); } catch (er) { box.select(); }
  }
});

// tooltip for map cells
var tip = $('tip');
function showTip(el) { var r = el.getBoundingClientRect(); tip.textContent = el.dataset.tip; tip.hidden = false;
  var x = Math.min(r.left, window.innerWidth - tip.offsetWidth - 8); tip.style.left = Math.max(8, x) + 'px';
  var y = r.top - tip.offsetHeight - 6; tip.style.top = (y < 8 ? r.bottom + 6 : y) + 'px'; }
document.addEventListener('mouseover', function (e) { var c = e.target.closest('.cell[data-tip]'); if (c) showTip(c); else tip.hidden = true; });
document.addEventListener('focusin', function (e) { var c = e.target.closest && e.target.closest('.cell[data-tip]'); if (c) showTip(c); else tip.hidden = true; });
window.addEventListener('scroll', function () { tip.hidden = true; }, { passive: true });

render();
boot();
})();
</script>
